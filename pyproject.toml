[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lepel"
version = "0.0.0"
description = "Lepel is a tiny, single-machine pipeline runner for experiment-style workflows: define a \"recipe\" that wires dependencies, runs ordered steps, and automatically persists/resumes state via checkpoints."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: MIT License",
]
authors = [{ name = "Onno Verberne" }]
license-files = ["LICENSE"]
keywords = [
    "Reinforcement Learning",
    "Machine Learning",
    "Experiments",
    "Pipeline",
    "Checkpointing",
    "Workflow",
]
dependencies = [
    'cloudpickle ~=3.1.2',
    "coolname ~=2.2.0",
    'gitpython ~=3.1.46',
    'pyyaml ~=6.0.3',
    'toml ~=0.10.2',
    'pathspec ~=1.0.3',
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.black]
line-length = 100
skip-string-normalization = true

[tool.ruff.format]
quote-style = "single"
